name: "suvisdev"
tagline: "AI 영화 추천(Mova)과 반려견 산책 경로(Gildle)를 하나의 모듈러 모놀리식 플랫폼에 통합"
period: "2026.07.08 ~ 2026.09.30 (약 12주, v1 마감)"
team_size: "1명 (개인 프로젝트)"
my_role: "풀스택 개발 · ML 파이프라인 · 인프라 · 데이터 수집"

problem: >-
  (1) 영화 추천: 수천 편 속에서 취향에 맞는 영화를 고르는 데 시간이 들고,
  LLM 챗봇은 없는 극장과 상영 시간을 지어낸다.
  Mova는 직접 파인튜닝한 소형 모델이 도구를 골라 부르고,
  사실은 데이터에서 가져와 답한다.
  (2) 산책 경로: 반려견과 산책할 때 그늘·경사·결빙·들를 곳을 고려한
  경로를 찾기 어렵다. Gildle은 서울 전역 보행 그래프에 환경 점수와 건물 그림자를 입혀
  계절·시간대별 경로 후보를 이유와 함께 보여 준다.

sub_projects:
  - name: "Mova"
    tagline: "AI 영화 추천 · 채팅 에이전트 · 리뷰 · 랭킹"
    description: >-
      파인튜닝한 EXAONE 3.5 2.4B가 채팅의 판단(도구 10개 중 선택)과 추천을 맡고
      Gemini가 폴백과 리뷰 요약을 맡는 영화 플랫폼. 카탈로그 3,919편,
      봤어요·별점 기록, 에디터 리뷰, 박스오피스 랭킹, 예매 시간표.
  - name: "Gildle"
    tagline: "반려견 산책 경로 추천 (웹 · 안드로이드 앱)"
    description: >-
      서울 전역 보행 그래프(간선 약 23만)에 수관·결빙·경사 점수와
      건물 약 80만 동의 그림자(월별 × 시간대)를 입혀,
      빠른·그늘·푸른·편한 길 후보를 이유와 함께 제시하는 산책 경로 추천 서비스.

features:
  - title: "영화 채팅 에이전트"
    description: "판단 모델(EXAONE 3.5 2.4B LoRA)이 도구 10개 중 다음 행동을 고른다. 출연진·시간표·OTT 같은 사실은 코드 템플릿이 답하고, 인자 근거·반복 호출·호출 예산은 코드가 막는다."
  - title: "AI 맞춤 영화 추천"
    description: "EXAONE 3.5 2.4B LoRA(GGUF)를 집 서버 GPU에서 서빙. 실패하면 Gemini로 자동 전환하고(연속 2회 실패 시 60초 우회) 살아나면 자동 복귀한다."
  - title: "봤어요 · 별점 · 취향"
    description: "채팅 한 문장으로 기록하고 취향 기반 추천·비슷한 영화·취향 요약에 쓴다. 제목 일부만 말해도, 후보 중에서 골라도 이어진다."
  - title: "에디터 리뷰 자동 생성"
    description: "뉴스 요약으로 리뷰를 만들고 감정분석 LoRA로 별점을 매긴다. 근거가 된 기사 링크와 신뢰도 배지를 함께 보여 준다."
  - title: "박스오피스 랭킹 · 개봉 예정작"
    description: "KOFIC API로 일별·주간·월간 한국 박스오피스 집계. TMDB API로 개봉 예정작 자동 갱신."
  - title: "산책 경로 후보"
    description: "출발·도착을 찍으면 빠른·그늘·푸른·편한 길 후보를 고를 이유와 함께 제시. 건물 그림자를 월별 × 시간대로 미리 계산해 같은 구간도 시각에 따라 다른 길이 나온다."
  - title: "문장으로 산책 추천 · 웹·앱 통일"
    description: "\"40분 동안 3키로 편하게\" 같은 문장을 읽어 코스를 추천. Next.js 웹과 Flutter 앱이 같은 API·같은 기능·같은 표기를 쓴다."
  - title: "인증 · 보안"
    description: "Google·Kakao·Naver OAuth 2.0과 이메일 로그인, httpOnly 쿠키 세션, 역할 권한(admin/user), IDOR 방어 전수 적용."

tech:
  - category: backend
    items: ["Python 3.12", "FastAPI", "PostgreSQL 16 + pgvector", "Redis", "SQLAlchemy 2.0 Async", "Alembic"]
  - category: frontend
    items: ["Next.js 16", "TypeScript 5.7", "React 19", "Tailwind CSS 4", "shadcn/ui", "네이버 지도 JS v3"]
  - category: mobile
    items: ["Flutter", "Dart", "Riverpod", "네이버 지도 SDK"]
  - category: ai
    items: ["EXAONE 3.5 2.4B LoRA (추천 GGUF · 판단 에이전트 v9)", "EXAONE 3.5 7.8B (문장 이해)", "Google Gemini API (폴백·요약)", "bge-m3 임베딩"]
  - category: data
    items: ["TMDB API", "KOFIC/KOBIS API", "카카오 로컬 API", "브이월드 건물", "OpenStreetMap / osmnx", "SRTM 고도", "서울 열린데이터"]
  - category: infra
    items: ["k3s (집 서버 + 노트북 온프레미스)", "Tailscale", "Docker", "llama.cpp · Ollama", "Cloudflare Tunnel", "Vercel", "AWS S3"]

architecture:
  description: >-
    모듈러 모놀리식 + 스타 토폴로지. ontology(Hub)가 공통 AI 파이프라인·에이전트 루프·이벤트 버스를,
    mova·gildle·viewer(Spoke)가 각 도메인 로직을 담당한다.
    Next.js 프론트(Vercel)가 Cloudflare Tunnel을 거쳐 노트북 또는 집 서버의 k3s 파드(FastAPI)를 호출하고,
    영화 추천은 집 서버의 llama.cpp 서버(EXAONE LoRA GGUF)가, 실패하면 Gemini가 받는다.
    산책 경로는 메모리에 올린 보행 그래프에서 A*로 계산한다.
    Flutter 모바일 앱은 동일 API를 공유한다.

erd:
  description: >-
    Mova: movies·reviews·rankings·picks·chat_conversations·user_actions 등 영화 도메인 테이블과
    users·groups 인증 테이블. Gildle: walks·push_tokens.
    두 도메인이 users 테이블을 공유하되, ORM 메타데이터는 앱별로 분리. 테이블 42개.

challenges:
  - title: "챗봇이 없는 사실을 지어낸다"
    situation: "\"누가 나와\"에 줄거리를 답하고, 없는 극장과 상영 시간을 말했다"
    cause: "6칸 슬롯 양식에 자리가 없는 질문은 정보가 사라졌고, 사실 문장까지 LLM에게 쓰게 했다"
    solution: "도구 호출 에이전트로 전환 — 판단은 파인튜닝한 2.4B, 사실은 코드 템플릿, 가드(인자 근거·반복·호출 예산)는 코드"
    result: "평가셋 86에서 77, 운영 회귀 하네스 단일턴 28/28"
  - title: "LoRA 서버 ↔ Gemini 자동 폴백"
    situation: "GPU 서버가 내려가면 추천 API가 그대로 실패했다"
    cause: "수동 환경 변수 전환에 의존했고, 폴백 어댑터를 만든 뒤에도 DI에 연결되지 않았다"
    solution: "폴백 어댑터를 DI에 연결하고 서킷 브레이커(연속 2회 실패 시 60초 우회) 추가"
    result: "GPU 장애에도 추천 무중단, 복구되면 자동 복귀"
  - title: "IDOR 취약점 5건 전수 수정"
    situation: "user_id를 경로·바디 파라미터로 받아 다른 사용자의 리소스에 접근 가능"
    cause: "초기 개발 시 user_id를 클라이언트 입력으로 신뢰, 토큰 기반 신원 확인 누락"
    solution: "전수 조사로 5건(mypage·profile·watchlist·picks·chat) 식별 후 전부 JWT 토큰 기반으로 전환"
    result: "모든 리소스 접근에 소유권 검증 적용, IDOR 취약점 0건"
  - title: "웹 토큰을 httpOnly 쿠키로"
    situation: "로그인 토큰이 브라우저 저장소에 있어 스크립트 공격으로 빠져나갈 수 있었다"
    cause: "초기 구현의 편의 — 클라이언트가 토큰을 직접 헤더에 실었다"
    solution: "Next.js 프록시가 쿠키를 읽어 백엔드 호출을 대행(BFF). 백엔드는 바꾸지 않았다"
    result: "토큰이 스크립트에서 보이지 않는다. 전환 뒤 드러난 회귀 3건도 같은 날 수정"
  - title: "EC2에서 노트북 온프레미스로"
    situation: "EC2는 30GB 디스크로 빌드가 반복 실패했고 GPU가 없어 집 GPU를 터널로 불러 썼다"
    cause: "torch 이미지가 디스크에 들어가지 않고, 백엔드와 GPU가 떨어져 있었다"
    solution: "프로덕션을 GPU가 있는 노트북으로 옮기고 k3s로 운영, 배포 스크립트가 환경 변수를 Secret으로 주입"
    result: "서버 비용 없이 백엔드와 GPU 추론이 한 기계에서 통신"

