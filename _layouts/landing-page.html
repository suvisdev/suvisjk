---
---
<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>{{ page.title }} — {{ site.app_name | default: site.title }}</title>
	<meta name="description" content="{{ site.app_description }}">

	{% if site.app_icon %}
	<link rel="shortcut icon" href="{{ site.app_icon | relative_url }}">
	{% endif %}

	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous">
	<link rel="stylesheet" href="{{ '/landing.css' | relative_url }}">
</head>

<body class="subPageBody">
	<div class="headerBackground subPageHeaderBackground">
		<div class="container subPageContainer">
			{% include landing-header-sub.html %}
			<article class="subPage">
				{% if page.title and page.title != "" %}
				<h1 class="subPageTitle">{{ page.title }}</h1>
				{% endif %}
				<div class="subPageContent">
					{{ content }}
				</div>
			</article>
			<footer class="subPageFooter">
				<p class="footerText">SEUK Team · 2026</p>
				<div class="footerLinks">
					<a href="{{ '/toc/' | relative_url }}">목차</a>
					<a href="{{ '/devlog/' | relative_url }}">개발 로그</a>
					<a href="{{ '/issues/' | relative_url }}">미결 항목</a>
				</div>
			</footer>
		</div>
	</div>
</body>
</html>
