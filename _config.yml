title: suvisdev
description: >-
  AI 영화 추천(Mova) · 반려견 산책 경로(Gildle) — 모듈러 모놀리식 풀스택 플랫폼
baseurl: ""
url: ""
github_username: suvisdev

theme: just-the-docs
plugins:
  - jekyll-feed

color_scheme: dark

aux_links:
  "GitHub":
    - "https://github.com/suvisdev/suvisdev.cloud"
  "Demo":
    - "https://suvisdev.cloud"
aux_links_new_tab: true

heading_anchors: true

nav_sort: case_insensitive

search_enabled: true
search:
  heading_level: 3

back_to_top: true
back_to_top_text: "맨 위로"

footer_content: "SEUK Team &copy; 2026 &mdash; suvisdev"

port: 4000

callouts:
  warning:
    title: 주의
    color: red
  note:
    title: 참고
    color: blue
  tip:
    title: 팁
    color: green

exclude:
  - CLAUDE.md
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - landing.css
  - _layouts/landing.html
  - _layouts/landing-page.html
  - _includes/landing-*.html
